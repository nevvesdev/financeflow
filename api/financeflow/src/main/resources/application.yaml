spring:
  application:
    name: financeflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financeflow}
    username: ${DB_USERNAME:financeflow}
    password: ${DB_PASSWORD:financeflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    locale: pt-BR
    locale-resolver: fixed

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

financeflow:
  fuso-horario: ${FUSO_HORARIO:America/Sao_Paulo}
  agendamento:
    habilitado: ${AGENDAMENTO_HABILITADO:true}
  recorrencias:
    cron: "${RECORRENCIAS_CRON:0 0 6 * * *}"
  jwt:
    segredo: ${JWT_SEGREDO:chave-somente-para-desenvolvimento-local-0123456789}
    expiracao: ${JWT_EXPIRACAO:2h}
    emissor: financeflow
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:4200}
  notificacoes:
    cron: "${NOTIFICACOES_CRON:0 30 7 * * *}"

