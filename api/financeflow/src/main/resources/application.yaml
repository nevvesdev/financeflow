spring:
  application:
    name: financeflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financeflow}
    username: ${DB_USERNAME:financeflow}
    password: ${DB_PASSWORD:financeflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info